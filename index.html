<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>İyi ki doğdun Hemşiremmm! 🐣</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background-repeat: repeat;
            background-size: 100px 100px;
            color: #ff69b4;
            position: relative;
            margin:0;
            padding:0;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-color: rgba(255, 255, 255, 0.6);
            z-index: -1;
        }

        h1 {
            margin-top: 32px;
            margin-bottom:0px;
            font-size: 3.5rem; /* Yazı boyutunu büyüttüm */
            background: rgba(255, 255, 255, 0.6);
            display: inline-block;
            border-radius: 12px;
            text-shadow: 1px 1px 2px #fff;
            color: #e60073;
        }

        p {
        margin-top:8px;
            font-size: 2.5rem; /* Yazı boyutunu büyüttüm */
            background: rgba(255, 255, 255, 0.6);
            display: inline-block;
            padding: 12px;
            border-radius: 12px;
            color: #cc0066;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .gallery img {
            width: 200px;
            height: 300px; /* Resim boyutunu değiştirdim */
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        audio {
            display: none;
        }
    </style>
  </head>
  <body>
    <div style="display:flex;flex-direction:column">
      <h1>İyi ki doğdun Hemşiremmm! 🎉</h1>
      <p>Seni ço∞ok seviyorum 💕</p>
    </div>


  </body>
</html>
